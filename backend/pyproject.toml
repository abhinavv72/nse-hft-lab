[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-hft-lab-backend"
version = "0.1.0"
description = "Local-first HFT-style simulator for Indian markets"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "yfinance==1.2.2",
  "websockets==15.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
